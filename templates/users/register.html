{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Create an Account</h3>
                    
                   
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="reg_username" class="form-control" placeholder="Choose a username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="reg_password" class="form-control" placeholder="Create a strong password" required>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 mt-2">Sign Up</button>
                    </form>
                    
                    
                    <div class="text-center mt-3">
                        <p class="text-muted">Already have an account? <a href="{% url 'login' %}" class="text-decoration-none">Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/register.js' %}"></script>
{% endblock %}
