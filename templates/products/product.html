{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 text-center mb-4">
            <div class="bg-white p-4 shadow-sm rounded">
                <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.name }}" style="max-height: 450px; object-fit: contain;">
            </div>
        </div>
        
        <div class="col-md-6">
            <h2 class="fw-bold display-5">{{ product.name }}</h2>
            <h3 class="text-success fw-bold mt-2">₹{{ product.price }}</h3>
            
            <hr class="my-4">
            
            <h5 class="fw-bold">Description</h5>
            <p class="text-muted" style="line-height: 1.8;">{{ product.description }}</p>
            
            {% if product.specifications %}
                <h5 class="fw-bold mt-4">Specifications</h5>
                <p class="text-muted" style="white-space: pre-wrap; line-height: 1.8;">{{ product.specifications }}</p>
            {% endif %}
            
            <div class="mt-5" id="cartButtonContainer" style="display: none;">
                <button class="btn btn-dark btn-lg w-100 py-3 fw-bold">Add to Cart</button>
            </div>
            
            <div class="mt-5" id="loginPromptContainer" style="display: none;">
                <a href="{% url 'login' %}" class="btn btn-outline-dark btn-lg w-100 py-3 fw-bold">Login to Buy</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const token = localStorage.getItem("access_token");
        
        if (token) {
            document.getElementById("cartButtonContainer").style.display = "block";
        } else {
            document.getElementById("loginPromptContainer").style.display = "block";
        }
    });
</script>
{% endblock %}
