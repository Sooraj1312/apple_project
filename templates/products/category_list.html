{% extends 'base.html' %}

{% block content %}
    <h2 class="text-center my-4">{{ category.name }}</h2>

    <div class="row">
        {% for item in products %}
            <div class="col-md-3 mb-4">
                <div class="card h-100 shadow-sm">
                    <img src="{{ item.image.url }}" class="card-img-top p-2" alt="{{ item.name }}" style="height: 200px; object-fit: contain;">
                    <div class="card-body text-center">
                        <h5 class="card-title">{{ item.name }}</h5>
                        <p class="card-text text-success fw-bold">Price: ₹{{ item.price }}</p>
                        <a href="{% url 'product_detail' item.id %}" class="btn btn-dark w-100 mt-2">View Details</a>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12 mt-5">
                <div class="alert alert-warning text-center shadow-sm" role="alert">
                    <h4 class="alert-heading">Sorry!</h4>
                    <p>No products available in this category at the moment.</p>
                    <a href="{% url 'store' %}" class="btn btn-outline-dark mt-2">Go to Store</a>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
